[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm25-lima-wavelet"
version = "1.0.2"
description = "Reproducible wavelet multiscale analysis of the Lima PM2.5 monitoring network"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Henry S. Aquino-Mosquera" },
  { name = "Jaime E. Villanueva-Ramirez" },
  { name = "Daniel A. Huaman-Cardenas" },
  { name = "Gualberto R. Quispe-Mendoza" },
]
dependencies = [
  "pandas==2.3.3",
  "numpy==2.5.1",
  "statsmodels==0.15.0",
  "PyWavelets==1.8.0",
  "scipy==1.18.0",
  "pingouin==0.7.0",
  "matplotlib==3.11.1",
  "seaborn==0.13.2",
  "PyYAML==6.0.3",
  "Pillow==13.0.0",
  "PyMuPDF==1.28.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
